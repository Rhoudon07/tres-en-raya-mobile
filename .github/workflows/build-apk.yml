name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚙️ Expo Prebuild (Generate Android native project)
        run: npx expo prebuild --platform android --no-install

      - name: 🔑 Ensure Android Debug Keystore
        run: |
          mkdir -p android/app
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🔨 Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📁 Collect APK
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-artifacts/TresEnRaya.apk \;
          ls -lh build-artifacts/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TresEnRaya-Mobile-APK
          path: build-artifacts/TresEnRaya.apk
          if-no-files-found: error
          retention-days: 30
